# Task-owned secretless correction/proof phase. No PR publication.
name: Image Dimensions 5f40ae04 Proof
on:
  push:
    branches: [proof/image-dimensions-5f40ae04-20261121]
permissions:
  contents: read
env:
  NO_COLOR: '1'
jobs:
  focused-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openclaw/openclaw
          ref: 19082a44a49109a0d93645b68caa0cb6a10b8837
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install isolated dependencies
        timeout-minutes: 15
        working-directory: upstream
        run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile
          node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts
      - name: Apply reviewed candidate
        run: cp proof/proof/image-dimensions/candidate/ui/src/pages/chat/components/* upstream/ui/src/pages/chat/components/
      - name: Format exact product paths and stage real base accounting
        id: formatting
        timeout-minutes: 3
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/format-evidence.py
      - name: Product types
        id: types
        timeout-minutes: 8
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py types -- pnpm tsgo:test:ui
      - name: Product lint
        id: lint
        timeout-minutes: 6
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py lint -- node scripts/run-oxlint.mjs --tsconfig tsconfig.ui.json ui/src/pages/chat/components/chat-attachment-image.ts ui/src/pages/chat/components/chat-attachment-reads.ts ui/src/pages/chat/components/chat-attachments.ts ui/src/pages/chat/components/chat-attachments.test.tsx ui/src/pages/chat/components/chat-attachment-dimensions.browser.test.ts
      - name: Product format
        id: format
        timeout-minutes: 2
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py format -- pnpm format:check ui/src/pages/chat/components/chat-attachment-image.ts ui/src/pages/chat/components/chat-attachment-reads.ts ui/src/pages/chat/components/chat-attachments.ts ui/src/pages/chat/components/chat-attachments.test.tsx ui/src/pages/chat/components/chat-attachment-dimensions.browser.test.ts
      - name: Product allocations
        id: allocations
        timeout-minutes: 3
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py allocations -- pnpm check:test-lines-ratchet
      - name: Product maxlines
        id: maxlines
        timeout-minutes: 3
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py maxlines -- pnpm check:max-lines-ratchet
      - name: Product unused
        id: unused
        timeout-minutes: 6
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py unused -- pnpm deadcode:unused-files
      - name: Product browser
        id: browser
        timeout-minutes: 5
        continue-on-error: true
        working-directory: upstream
        run: python3 ../proof/proof/image-dimensions/run-check.py browser -- node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-browser.config.ts --configLoader runner ui/src/pages/chat/components/chat-attachment-dimensions.browser.test.ts ui/src/pages/chat/components/chat-attachment-resize.browser.test.ts ui/src/pages/chat/components/chat-attachment-inputs.browser.test.ts --maxWorkers=1
      - name: Near-cap JPEG Chromium OS memory qualification
        id: memory
        timeout-minutes: 5
        continue-on-error: true
        working-directory: upstream
        run: |
          cp ../proof/proof/image-dimensions/memory.browser.test.ts ui/src/pages/chat/components/image-proof-memory.browser.test.ts
          python3 ../proof/proof/image-dimensions/run-check.py memory -- python3 ../proof/proof/image-dimensions/memory-check.py node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-browser.config.ts --configLoader runner ui/src/pages/chat/components/image-proof-memory.browser.test.ts --maxWorkers=1
      - name: Build isolated real Gateway runtime
        id: runtime
        timeout-minutes: 20
        continue-on-error: true
        working-directory: upstream
        env:
          OPENCLAW_BUILD_PRIVATE_QA: '1'
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: '1'
        run: python3 ../proof/proof/image-dimensions/run-check.py runtime -- pnpm build
      - name: Real WebChat to mocked-provider boundary
        id: boundary
        if: steps.runtime.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        working-directory: upstream
        run: |
          cp ../proof/proof/image-dimensions/model-boundary.e2e.test.ts extensions/qa-lab/src/control-ui-media-transcript.real-gateway.e2e.test.ts
          python3 ../proof/proof/image-dimensions/run-check.py boundary -- node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner extensions/qa-lab/src/control-ui-media-transcript.real-gateway.e2e.test.ts --maxWorkers=1
      - name: Exact outcomes
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["OUTCOMES"])
          wanted = ["formatting", "types", "lint", "format", "allocations", "maxlines", "unused", "browser", "memory", "runtime", "boundary"]
          outcomes = {name: steps.get(name, {}).get("outcome", "missing") for name in wanted}
          print("::notice title=Phase outcomes::" + json.dumps(outcomes))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("Proof SHA: " + os.environ["GITHUB_SHA"] + "\n" + json.dumps(outcomes) + "\nMock provider, not live paid model. Memory is measured only on hosted Chromium.\n")
          raise SystemExit(0 if all(value == "success" for value in outcomes.values()) else 1)
          PY
