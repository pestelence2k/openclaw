name: PR 202214 Secretless Proof
run-name: PR 202214 cycle proof - bounded missing-event retry - tree 0b6e48179ff0
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: 45b07b2be25bbbeddafde2ba4511c3a15f88bd12
          fetch-depth: 20
          persist-credentials: false
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Reproduce reviewed static cycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 600s bash -c 'set +e
          pnpm check:madge-import-cycles > "$RUNNER_TEMP/cycle-before.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-before.log"
          test "$status" -ne 0 && grep -q '"'"'chat-completion-read.ts'"'"' "$RUNNER_TEMP/cycle-before.log"
          ' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Reproduce reviewed static cycle::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Reproduce reviewed static cycle output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Apply exact reviewed dependency leaf patch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 60s bash -c 'set -euo pipefail
          test "$(git rev-parse HEAD)" = 45b07b2be25bbbeddafde2ba4511c3a15f88bd12
          python3 - <<'"'"'PY'"'"'
          import base64,hashlib,subprocess
          patch=base64.b64decode('"'"''"'"')
          assert hashlib.sha256(patch).hexdigest()=='"'"'26e5a5a609abf3788aa3b3b7ed7e19e09c7164e7e0c57b80b8798f232f002178'"'"'
          subprocess.run(["git","apply","--index"],input=patch,check=True)
          PY
          test "$(git write-tree)" = 0b6e48179ff0ad323933bf29f04086bb78ff8806
          git diff --cached --check
          git diff --cached --stat
          ' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Apply exact reviewed dependency leaf patch::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Apply exact reviewed dependency leaf patch output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Canonical static import cycle gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 600s bash -c 'pnpm check:madge-import-cycles' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Canonical static import cycle gate::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Canonical static import cycle gate output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Affected hook and renderer regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 360s bash -c 'pnpm test ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/pages/chat/components/chat-transcript-read-presentation.test.tsx ui/src/pages/chat/components/chat-transcript-prepared-rows.test.tsx ui/src/pages/chat/components/chat-transcript-layout-owner.test.ts ui/src/pages/chat/components/chat-transcript-layout-retention.test.ts --maxWorkers=1' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Affected hook and renderer regressions::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Affected hook and renderer regressions output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Scoped canonical formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s bash -c 'pnpm format:check ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/pages/chat/components/chat-completion-read.ts ui/src/pages/chat/components/chat-transcript-layout-solid.tsx ui/src/pages/chat/components/chat-transcript-layout.ts ui/src/pages/chat/components/chat-transcript-read-presentation.ts' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Scoped canonical formatting::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Scoped canonical formatting output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Scoped canonical lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 480s bash -c 'pnpm lint --base 45b07b2be25bbbeddafde2ba4511c3a15f88bd12 --files-json '"'"'["ui/src/pages/chat/components/chat-completion-read.test.tsx","ui/src/pages/chat/components/chat-completion-read.ts","ui/src/pages/chat/components/chat-transcript-layout-solid.tsx","ui/src/pages/chat/components/chat-transcript-layout.ts","ui/src/pages/chat/components/chat-transcript-read-presentation.ts"]'"'"'' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Scoped canonical lint::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Scoped canonical lint output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: UI type validation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 360s bash -c 'pnpm tsgo:ui' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=UI type validation::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=UI type validation output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: UI build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 600s bash -c 'pnpm ui:build' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=UI build::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=UI build output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
      - name: Final tree and unchanged proof input inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 60s bash -c 'set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 0b6e48179ff0ad323933bf29f04086bb78ff8806
          python3 - <<'"'"'PY'"'"'
          import subprocess,hashlib
          excluded={'"'"'ui/src/pages/chat/components/chat-completion-read.ts'"'"', '"'"'ui/src/pages/chat/components/chat-completion-read.test.tsx'"'"', '"'"'ui/src/pages/chat/components/chat-transcript-layout.ts'"'"', '"'"'ui/src/pages/chat/components/chat-transcript-layout-solid.tsx'"'"', '"'"'ui/src/pages/chat/components/chat-transcript-read-presentation.ts'"'"'}
          def entries(ref):
              return [r for r in subprocess.check_output(["git","ls-tree","-rz",ref]).split(bytes([0])) if r and r.split(bytes([9]),1)[1].decode() not in excluded]
          assert entries("45b07b2be25bbbeddafde2ba4511c3a15f88bd12")==entries("0b6e48179ff0ad323933bf29f04086bb78ff8806")
          print("Unchanged outside five context extraction paths: "+hashlib.sha256(bytes([0]).join(entries("0b6e48179ff0ad323933bf29f04086bb78ff8806"))).hexdigest())
          PY
          ' > "$RUNNER_TEMP/cycle-proof.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cycle-proof.log"
          python3 - "$status" "$RUNNER_TEMP/cycle-proof.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          def esc(s):
              return s.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          print(f"::{kind} title=Final tree and unchanged proof input inventory::exit={status}; candidate tree 0b6e48179ff0ad323933bf29f04086bb78ff8806")
          tail=text[-9000:]
          for i in range(0,len(tail),3000):
              print(f"::{kind} title=Final tree and unchanged proof input inventory output {i//3000}::"+esc(tail[i:i+3000]))
          PY
          exit "$status"
