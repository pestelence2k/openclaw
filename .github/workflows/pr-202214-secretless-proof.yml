name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: 7512cb4435150913d64374731888ded3ae67952f
          fetch-depth: 20
          persist-credentials: false
      - name: Verify exact candidate and unchanged production
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7512cb4435150913d64374731888ded3ae67952f
          python3 - <<'PY'
          import subprocess,hashlib
          excluded={"src/shared/web-push-completion.test.ts","ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts","ui/src/e2e/fixtures/service-worker-v2026.11.5.txt","config/test-lines-allocations/202178-browser-notification-read-dismissal.txt"}
          def tree(ref):
              return [r for r in subprocess.check_output(["git","ls-tree","-rz",ref]).split(bytes([0])) if r and r.split(bytes([9]),1)[1].decode() not in excluded]
          before,after=tree("e0b0cb680c18b19585d52f72d65cb00e5f9dab89"),tree("HEAD")
          assert before==after
          print("::notice title=Unchanged production inputs::"+hashlib.sha256(bytes([0]).join(after)).hexdigest())
          PY
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Scoped formatter diagnostic and exact-tree restoration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s pnpm format src/shared/web-push-completion.test.ts ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts
          git diff --binary > "$RUNNER_TEMP/upgrade-format.patch"
          python3 - "$RUNNER_TEMP/upgrade-format.patch" <<'PY'
          import pathlib,sys,base64,hashlib
          data=pathlib.Path(sys.argv[1]).read_bytes()
          print("::notice title=Upgrade formatter digest::"+hashlib.sha256(data).hexdigest())
          encoded=base64.b64encode(data).decode()
          assert len(encoded)<24000
          for i in range(0,len(encoded),3000):
              print("::notice title=Upgrade formatter chunk "+str(i//3000)+"::"+encoded[i:i+3000])
          PY
          git restore -- src/shared/web-push-completion.test.ts ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts
          test -z "$(git status --porcelain)"
          test ! -s "$RUNNER_TEMP/upgrade-format.patch"
      - name: Identity runtime tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s pnpm test src/shared/web-push-completion.test.ts ui/src/app/web-push-read.runtime.test.ts --maxWorkers=1 > "$RUNNER_TEMP/upgrade-proof.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/upgrade-proof.log"
          python3 - "$proof_status" "$RUNNER_TEMP/upgrade-proof.log" <<'PY'
          import sys,pathlib
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=Upgrade proof status::candidate 7512cb4435150913d64374731888ded3ae67952f; exit={status}")
          tail="\n".join(text.splitlines()[-45:])[-6000:]
          for i in range(0,len(tail),3000):
              escaped=tail[i:i+3000].replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
              print(f"::{kind} title=Upgrade proof output {i//3000}::"+escaped)
          PY
          exit "$proof_status"
      - name: Scoped canonical lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 480s pnpm lint --base 1ade2b7a8899ea45934f93e7ede48443dff7d515 --files-json '["src/shared/web-push-completion.test.ts","ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts"]' > "$RUNNER_TEMP/upgrade-proof.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/upgrade-proof.log"
          python3 - "$proof_status" "$RUNNER_TEMP/upgrade-proof.log" <<'PY'
          import sys,pathlib
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=Upgrade proof status::candidate 7512cb4435150913d64374731888ded3ae67952f; exit={status}")
          tail="\n".join(text.splitlines()[-45:])[-6000:]
          for i in range(0,len(tail),3000):
              escaped=tail[i:i+3000].replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
              print(f"::{kind} title=Upgrade proof output {i//3000}::"+escaped)
          PY
          exit "$proof_status"
      - name: Qualify Chromium
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts --require-playwright-chromium > "$RUNNER_TEMP/upgrade-proof.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/upgrade-proof.log"
          python3 - "$proof_status" "$RUNNER_TEMP/upgrade-proof.log" <<'PY'
          import sys,pathlib
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=Upgrade proof status::candidate 7512cb4435150913d64374731888ded3ae67952f; exit={status}")
          tail="\n".join(text.splitlines()[-45:])[-6000:]
          for i in range(0,len(tail),3000):
              escaped=tail[i:i+3000].replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
              print(f"::{kind} title=Upgrade proof output {i//3000}::"+escaped)
          PY
          exit "$proof_status"
      - name: Worker upgrade and dismissal proof
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 600s pnpm test ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts --maxWorkers=1 > "$RUNNER_TEMP/upgrade-proof.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/upgrade-proof.log"
          python3 - "$proof_status" "$RUNNER_TEMP/upgrade-proof.log" <<'PY'
          import sys,pathlib
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=Upgrade proof status::candidate 7512cb4435150913d64374731888ded3ae67952f; exit={status}")
          tail="\n".join(text.splitlines()[-45:])[-6000:]
          for i in range(0,len(tail),3000):
              escaped=tail[i:i+3000].replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
              print(f"::{kind} title=Upgrade proof output {i//3000}::"+escaped)
          PY
          exit "$proof_status"
      - name: Test allocation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s pnpm check:test-lines-ratchet --base 1ade2b7a8899ea45934f93e7ede48443dff7d515 > "$RUNNER_TEMP/upgrade-proof.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/upgrade-proof.log"
          python3 - "$proof_status" "$RUNNER_TEMP/upgrade-proof.log" <<'PY'
          import sys,pathlib
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(errors="replace")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=Upgrade proof status::candidate 7512cb4435150913d64374731888ded3ae67952f; exit={status}")
          tail="\n".join(text.splitlines()[-45:])[-6000:]
          for i in range(0,len(tail),3000):
              escaped=tail[i:i+3000].replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
              print(f"::{kind} title=Upgrade proof output {i//3000}::"+escaped)
          PY
          exit "$proof_status"
