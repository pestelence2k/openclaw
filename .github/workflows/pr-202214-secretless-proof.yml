name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: e0b0cb680c18b19585d52f72d65cb00e5f9dab89
          fetch-depth: 11
          persist-credentials: false
      - name: Verify candidate identity and unchanged tested inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e0b0cb680c18b19585d52f72d65cb00e5f9dab89
          test "$(git rev-parse HEAD^)" = 5fa0ba8a489f368f19c7a2190e2497f763bd327f
          test "$(git rev-parse HEAD~10)" = 1ade2b7a8899ea45934f93e7ede48443dff7d515
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import subprocess,hashlib
          excluded='config/test-lines-allocations/202178-browser-notification-read-dismissal.txt'
          def entries(ref):
              rows=subprocess.check_output(["git","ls-tree","-rz",ref]).split(bytes([0]))
              return [r for r in rows if r and r.split(bytes([9]),1)[1].decode()!=excluded]
          before,after=entries('5fa0ba8a489f368f19c7a2190e2497f763bd327f'),entries("HEAD")
          assert before==after
          assert hashlib.sha256(bytes([0]).join(after)).hexdigest()=='a297e69184e203d491b92c6ab381d7849feb90d6de57be576484fd87498a5749'
          print("::notice title=PR202214 unchanged tested inputs::SHA256 a297e69184e203d491b92c6ab381d7849feb90d6de57be576484fd87498a5749; 66136 entries identical except allocation record; affected proof44800188759")
          PY
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Validate exact regression allocation
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s pnpm check:test-lines-ratchet --base 1ade2b7a8899ea45934f93e7ede48443dff7d515 > "$RUNNER_TEMP/layout-budget.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/layout-budget.log"
          python3 - "$proof_status" "$RUNNER_TEMP/layout-budget.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          message=pathlib.Path(sys.argv[2]).read_text()[-3800:]
          message=message.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 allocation proof::"+message)
          PY
          exit "$proof_status"
      - name: Verify renderer fixture stderr at final head
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 240s pnpm test ui/src/pages/chat/components/chat-transcript-read-presentation.test.tsx --maxWorkers=1 > "$RUNNER_TEMP/layout-fixture.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/layout-fixture.log"
          python3 - "$proof_status" "$RUNNER_TEMP/layout-fixture.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          text=pathlib.Path(sys.argv[2]).read_text(); lines=text.splitlines(); positions={j for i,line in enumerate(lines) if "stderr" in line for j in range(i,min(i+16,len(lines)))}; message=chr(10).join(lines[i] for i in sorted(positions))[-2500:]+text[-1200:]
          message=message.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 renderer fixture diagnostics::"+message)
          PY
          exit "$proof_status"
      - name: Full build at final candidate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 1080s pnpm build > "$RUNNER_TEMP/layout-build.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/layout-build.log"
          python3 - "$proof_status" "$RUNNER_TEMP/layout-build.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          message=pathlib.Path(sys.argv[2]).read_text()[-3800:]
          message=message.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 full build proof::"+message)
          PY
          exit "$proof_status"
