name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: 61a419f1f3b173b65033bd1a584d76fe2c8bf3e8
          fetch-depth: 4
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 61a419f1f3b173b65033bd1a584d76fe2c8bf3e8
          test "$(git rev-parse HEAD~2)" = af8048422e591407a3d44ce47fb54224d9a6c40d
          test "$(git rev-parse HEAD~3)" = 1ade2b7a8899ea45934f93e7ede48443dff7d515
          test -z "$(git status --porcelain)"
          git show --no-patch --format=fuller HEAD
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Produce scoped formatter patch only
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 180s pnpm format src/shared/web-push-completion.ts src/shared/web-push-completion.test.ts src/infra/push-web.ts src/gateway/event-web-push.ts src/gateway/event-web-push.test.ts ui/public/sw.js ui/src/app/web-push-read.runtime.ts ui/src/app/web-push-read.runtime.test.ts ui/src/app/web-push-read-admission.test.ts ui/src/app/web-push.runtime.ts ui/src/app/web-push.ts ui/src/app/service-worker-lifecycle.test.ts ui/src/pages/chat/components/chat-completion-read.ts ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/pages/chat/components/chat-message-bubble-options.ts ui/src/pages/chat/components/chat-message-bubble-view.tsx ui/src/pages/chat/components/chat-transcript-actions.ts test/vitest/vitest.ui-isolated-paths.mjs ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts
          git diff --check
          python3 - <<'PY'
          import base64,hashlib,subprocess
          patch=subprocess.check_output(["git","diff","--binary"])
          assert len(patch) < 100000, "Unexpectedly broad formatting patch"
          encoded=base64.b64encode(patch).decode()
          print("::notice title=PR202214 format patch digest::"+hashlib.sha256(patch).hexdigest())
          for i in range(0,len(encoded),3000):
              print(f"::notice title=PR202214 format patch chunk {i//3000:03d}::"+encoded[i:i+3000])
          PY
