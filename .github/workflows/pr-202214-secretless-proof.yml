name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: 2bcf71a82d579dc85f4d39125109d48fb61df311
          fetch-depth: 7
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2bcf71a82d579dc85f4d39125109d48fb61df311
          test "$(git rev-parse HEAD^)" = 7b3a3129a2c73ffc3907f7c882e1070d5c144bc8
          test "$(git rev-parse HEAD~6)" = 1ade2b7a8899ea45934f93e7ede48443dff7d515
          test -z "$(git status --porcelain)"
          git show --no-patch --format=fuller HEAD
          python3 - <<'PY'
          import subprocess,hashlib
          excluded={'ui/src/app/service-worker-lifecycle.test.ts', 'config/test-lines-allocations/202178-browser-notification-read-dismissal.txt'}
          def entries(ref):
              rows=subprocess.check_output(["git","ls-tree","-rz",ref]).split(b"\0")
              return [r for r in rows if r and r.split(b"\t",1)[1].decode() not in excluded]
          before,after=entries("7b3a3129a2c73ffc3907f7c882e1070d5c144bc8"),entries("HEAD")
          assert before==after
          assert hashlib.sha256(b"\0".join(after)).hexdigest()=="b4ae3ee326ef52da5d309755dc02f79822186258f97c6deb64deb61dfa842f09"
          print("::notice title=PR202214 unchanged production inputs::SHA256 b4ae3ee326ef52da5d309755dc02f79822186258f97c6deb64deb61dfa842f09; all tracked entries unchanged except fixture assertion and allocation")
          PY
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: focused new behavior and existing capability regressions; project runner selects owning UI/isolation/Gateway shards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 360s pnpm test src/shared/web-push-completion.test.ts src/gateway/event-web-push.test.ts ui/src/app/service-worker-lifecycle.test.ts ui/src/app/web-push-read.runtime.test.ts ui/src/app/web-push-read-admission.test.ts ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/app/web-push.test.tsx --maxWorkers=1 > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          lines=pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate 2bcf71a82d579dc85f4d39125109d48fb61df311")
          if status:
              # Keep below the observed per-step annotation count and message size limits.
              print("::error title=PR202214 diagnostic tail::"+escape("\n".join(lines[-40:])[-3800:]))
          PY
          exit "$proof_status"
      - name: format changed files; wrapper may require pinned Bun parity under CI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s pnpm format:check src/shared/web-push-completion.ts src/shared/web-push-completion.test.ts src/infra/push-web.ts src/gateway/event-web-push.ts src/gateway/event-web-push.test.ts ui/public/sw.js ui/src/app/web-push-read.runtime.ts ui/src/app/web-push-read.runtime.test.ts ui/src/app/web-push-read-admission.test.ts ui/src/app/web-push.runtime.ts ui/src/app/web-push.ts ui/src/app/service-worker-lifecycle.test.ts ui/src/pages/chat/components/chat-completion-read.ts ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/pages/chat/components/chat-message-bubble-options.ts ui/src/pages/chat/components/chat-message-bubble-view.tsx ui/src/pages/chat/components/chat-transcript-actions.ts test/vitest/vitest.ui-isolated-paths.mjs ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          lines=pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate 2bcf71a82d579dc85f4d39125109d48fb61df311")
          if status:
              # Keep below the observed per-step annotation count and message size limits.
              print("::error title=PR202214 diagnostic tail::"+escape("\n".join(lines[-40:])[-3800:]))
          PY
          exit "$proof_status"
      - name: Source lint with canonical file projection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 480s pnpm lint --base 1ade2b7a8899ea45934f93e7ede48443dff7d515 --files-json '["src/shared/web-push-completion.ts","src/shared/web-push-completion.test.ts","src/infra/push-web.ts","src/gateway/event-web-push.ts","src/gateway/event-web-push.test.ts","ui/public/sw.js","ui/src/app/web-push-read.runtime.ts","ui/src/app/web-push-read.runtime.test.ts","ui/src/app/web-push-read-admission.test.ts","ui/src/app/web-push.runtime.ts","ui/src/app/web-push.ts","ui/src/app/service-worker-lifecycle.test.ts","ui/src/pages/chat/components/chat-completion-read.ts","ui/src/pages/chat/components/chat-completion-read.test.tsx","ui/src/pages/chat/components/chat-message-bubble-options.ts","ui/src/pages/chat/components/chat-message-bubble-view.tsx","ui/src/pages/chat/components/chat-transcript-actions.ts","ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts"]' test/vitest/vitest.ui-isolated-paths.mjs > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib,sys
          status=int(sys.argv[1])
          lines=pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          kind="notice" if status==0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate 2bcf71a82d579dc85f4d39125109d48fb61df311")
          if status:
              # Keep below the observed per-step annotation count and message size limits.
              print("::error title=PR202214 diagnostic tail::"+escape("\n".join(lines[-40:])[-3800:]))
          PY
          exit "$proof_status"
