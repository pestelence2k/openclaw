name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b
          fetch-depth: 3
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b
          test "$(git rev-parse HEAD^)" = af8048422e591407a3d44ce47fb54224d9a6c40d
          test "$(git rev-parse HEAD~2)" = 1ade2b7a8899ea45934f93e7ede48443dff7d515
          test -z "$(git status --porcelain)"
          git show --no-patch --format=fuller HEAD
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Validation 2 format changed files; wrapper may require pinned Bun parity under CI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s 'pnpm' 'format:check' 'src/shared/web-push-completion.ts' 'src/shared/web-push-completion.test.ts' 'src/infra/push-web.ts' 'src/gateway/event-web-push.ts' 'src/gateway/event-web-push.test.ts' 'ui/public/sw.js' 'ui/src/app/web-push-read.runtime.ts' 'ui/src/app/web-push-read.runtime.test.ts' 'ui/src/app/web-push-read-admission.test.ts' 'ui/src/app/web-push.runtime.ts' 'ui/src/app/web-push.ts' 'ui/src/app/service-worker-lifecycle.test.ts' 'ui/src/pages/chat/components/chat-completion-read.ts' 'ui/src/pages/chat/components/chat-completion-read.test.tsx' 'ui/src/pages/chat/components/chat-message-bubble-options.ts' 'ui/src/pages/chat/components/chat-message-bubble-view.tsx' 'ui/src/pages/chat/components/chat-transcript-actions.ts' 'test/vitest/vitest.ui-isolated-paths.mjs' 'ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts' > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib, sys
          status = int(sys.argv[1])
          lines = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kind = "notice" if status == 0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b")
          if status:
              for line in lines[-35:]:
                  print("::error title=PR202214 bounded diagnostic::" + escape(line[:1800]))
          PY
          exit "$proof_status"
      - name: Qualify Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts --require-playwright-chromium > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib, sys
          status = int(sys.argv[1])
          lines = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kind = "notice" if status == 0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b")
          if status:
              for line in lines[-35:]:
                  print("::error title=PR202214 bounded diagnostic::" + escape(line[:1800]))
          PY
          exit "$proof_status"
      - name: Native browser completion dismissal proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s pnpm test ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts --maxWorkers=1 > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib, sys
          status = int(sys.argv[1])
          lines = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kind = "notice" if status == 0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b")
          if status:
              for line in lines[-35:]:
                  print("::error title=PR202214 bounded diagnostic::" + escape(line[:1800]))
          PY
          exit "$proof_status"
      - name: Core build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 1080s pnpm build > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib, sys
          status = int(sys.argv[1])
          lines = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kind = "notice" if status == 0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b")
          if status:
              for line in lines[-35:]:
                  print("::error title=PR202214 bounded diagnostic::" + escape(line[:1800]))
          PY
          exit "$proof_status"
      - name: Source lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 480s pnpm lint --base 1ade2b7a8899ea45934f93e7ede48443dff7d515 'src/shared/web-push-completion.ts' 'src/shared/web-push-completion.test.ts' 'src/infra/push-web.ts' 'src/gateway/event-web-push.ts' 'src/gateway/event-web-push.test.ts' 'ui/public/sw.js' 'ui/src/app/web-push-read.runtime.ts' 'ui/src/app/web-push-read.runtime.test.ts' 'ui/src/app/web-push-read-admission.test.ts' 'ui/src/app/web-push.runtime.ts' 'ui/src/app/web-push.ts' 'ui/src/app/service-worker-lifecycle.test.ts' 'ui/src/pages/chat/components/chat-completion-read.ts' 'ui/src/pages/chat/components/chat-completion-read.test.tsx' 'ui/src/pages/chat/components/chat-message-bubble-options.ts' 'ui/src/pages/chat/components/chat-message-bubble-view.tsx' 'ui/src/pages/chat/components/chat-transcript-actions.ts' 'test/vitest/vitest.ui-isolated-paths.mjs' 'ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts' > "$RUNNER_TEMP/pr202214-step.log" 2>&1
          proof_status=$?
          cat "$RUNNER_TEMP/pr202214-step.log"
          python3 - "$proof_status" "$RUNNER_TEMP/pr202214-step.log" <<'PY'
          import pathlib, sys
          status = int(sys.argv[1])
          lines = pathlib.Path(sys.argv[2]).read_text(errors="replace").splitlines()
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kind = "notice" if status == 0 else "error"
          print(f"::{kind} title=PR202214 proof result::exit={status}; exact candidate e89824ca3415eafbe568f15f9e6fa6e6b56e0f0b")
          if status:
              for line in lines[-35:]:
                  print("::error title=PR202214 bounded diagnostic::" + escape(line[:1800]))
          PY
          exit "$proof_status"
