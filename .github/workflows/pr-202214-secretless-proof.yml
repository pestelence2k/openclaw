name: PR 202214 Secretless Proof
on:
  push:
    branches: [proof/pr-202214-secretless]
    paths: [.github/workflows/pr-202214-secretless-proof.yml]
permissions:
  contents: read
concurrency:
  group: pr-202214-secretless-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'pestelence2k/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pestelence2k/openclaw
          ref: 3eaf7e8ad160767e44fb69f676cb026fcebef006
          fetch-depth: 9
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3eaf7e8ad160767e44fb69f676cb026fcebef006
          test "$(git rev-parse HEAD^)" = 48e43dffd7fd9820543982318499b293f242d598
          test "$(git rev-parse HEAD~8)" = 1ade2b7a8899ea45934f93e7ede48443dff7d515
          test -z "$(git status --porcelain)"
          git show --no-patch --format=fuller HEAD
      - name: Setup qualified Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Stage byte-verified repository Bun pin
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-openclaw-bun.sh "$RUNNER_TEMP/proof-bun" linux x64
          echo "$RUNNER_TEMP/proof-bun/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/proof-bun/bin/bun" --revision
      - name: Frozen dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(pnpm --version)" = 12.15.0
          pnpm install --frozen-lockfile
      - name: Produce scoped layout formatter patch
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 180s pnpm format src/shared/web-push-completion.ts src/shared/web-push-completion.test.ts src/infra/push-web.ts src/gateway/event-web-push.ts src/gateway/event-web-push.test.ts ui/public/sw.js ui/src/app/web-push-read.runtime.ts ui/src/app/web-push-read.runtime.test.ts ui/src/app/web-push-read-admission.test.ts ui/src/app/web-push.runtime.ts ui/src/app/web-push.ts ui/src/app/service-worker-lifecycle.test.ts ui/src/pages/chat/components/chat-completion-read.ts ui/src/pages/chat/components/chat-completion-read.test.tsx ui/src/pages/chat/components/chat-message-bubble-options.ts ui/src/pages/chat/components/chat-message-bubble-view.tsx ui/src/pages/chat/components/chat-transcript-actions.ts test/vitest/vitest.ui-isolated-paths.mjs ui/src/e2e/browser-notification-read-dismissal.e2e.test.ts ui/src/pages/chat/components/chat-transcript-layout.ts ui/src/pages/chat/components/chat-transcript-layout-solid.tsx ui/src/pages/chat/components/chat-transcript-read-presentation.test.tsx
          git diff --check
          git diff --binary > "$RUNNER_TEMP/layout-format.patch"
          python3 - "$RUNNER_TEMP/layout-format.patch" <<'PY'
          import pathlib,hashlib,sys,base64
          patch=pathlib.Path(sys.argv[1]).read_bytes()
          assert len(base64.b64encode(patch)) <= 72000
          print("::notice title=PR202214 layout format digest::"+hashlib.sha256(patch).hexdigest())
          PY
      - name: Export layout format patch batch 0
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/layout-format.patch" <<'PY'
          import pathlib,sys,base64
          encoded=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode()
          for chunk in range(0,8):
              value=encoded[chunk*3000:(chunk+1)*3000]
              if value:
                  print(f"::notice title=PR202214 layout format chunk {chunk:03d}::"+value)
          PY
      - name: Export layout format patch batch 1
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/layout-format.patch" <<'PY'
          import pathlib,sys,base64
          encoded=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode()
          for chunk in range(8,16):
              value=encoded[chunk*3000:(chunk+1)*3000]
              if value:
                  print(f"::notice title=PR202214 layout format chunk {chunk:03d}::"+value)
          PY
      - name: Export layout format patch batch 2
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/layout-format.patch" <<'PY'
          import pathlib,sys,base64
          encoded=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode()
          for chunk in range(16,24):
              value=encoded[chunk*3000:(chunk+1)*3000]
              if value:
                  print(f"::notice title=PR202214 layout format chunk {chunk:03d}::"+value)
          PY
